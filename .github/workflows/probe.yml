name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q yt-dlp && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: |
          U=$(yt-dlp -g -f 232 "https://www.youtube.com/channel/UCos52azQNBgW63_9uDJoPDA/live")
          ffmpeg -loglevel error -y -i "$U" -t 20 -vf fps=1/5 f_%02d.jpg && ls -la f_*.jpg
